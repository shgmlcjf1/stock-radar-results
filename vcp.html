<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VCP 후보 종목</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:1150px;margin:auto;padding:20px;background:#0e1523;color:#e6eef8}h1{font-size:24px}.panel{background:#1a2637;border-radius:16px;padding:18px;margin:14px 0}button,select{background:#263850;color:white;border:1px solid #456079;border-radius:8px;padding:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px;border-bottom:1px solid #32445c;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.scroll{overflow-x:auto}.muted{color:#a7b9ce}.pill{display:inline-block;background:#174f4c;color:#bdf5e2;border-radius:10px;padding:4px 10px}</style></head><body><nav><a style="color:#a7cbff" href="./">← 52주 신고가</a></nav><h1>VCP 종목 검색</h1><p class="muted">50/150/200일선 정배열 + 상승 추세 + 최근 5봉 변동성 축소 + 거래량 감소</p><div class="panel"><label for="date">검출일 </label><select id="date"></select> <button id="reload">다시 불러오기</button> <span id="status" class="muted"></span></div><div class="panel"><div id="summary"></div><div class="scroll"><table><thead><tr><th>종목명(코드)</th><th>종가</th><th>200봉 고가 대비</th><th>52주 최저가 대비</th><th>50일선 이격률</th><th>거래량 감소 일수</th><th>5봉 최대 고저폭</th><th>5봉 최대 몸통</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const prefix='./vcp/'; const d=document.getElementById('date');
async function json(path){const response=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);return response.json()}
async function loadDates(){let dates=await json(prefix+'index.json'); d.innerHTML=dates.map(v=>`<option value="${v}">${v}</option>`).join('');await load()}
function fmt(v){return Number(v).toLocaleString('ko-KR')};function pct(v){return (v>=0?'+':'')+Number(v).toFixed(2)+'%'}
async function load(){const status=document.getElementById('status');status.textContent='불러오는 중';try{const x=await json(prefix+d.value+'.json');document.getElementById('summary').innerHTML=`<p><span class="pill">${x.date}</span> ${fmt(x.scanned)}개 검색 · <b>${fmt(x.count)}개 충족</b></p>`;document.getElementById('rows').innerHTML=(x.stocks||[]).map(s=>`<tr><td>${s.name} (${s.code})</td><td>${fmt(s.close)}</td><td>${pct(s.from_200bar_high_pct)}</td><td>${pct(s.from_52week_low_pct)}</td><td>${pct((s.close/s.ma50-1)*100)}</td><td>${s.low_volume_days}회</td><td>${s.max_5day_intraday_range_pct}%</td><td>${s.max_5day_body_pct}%</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:32px">조건을 모두 만족하는 종목이 없습니다.</td></tr>';status.textContent='완료';}catch(e){status.textContent='불러오기 실패: '+e.message}}
document.getElementById('reload').addEventListener('click',load);d.addEventListener('change',load);loadDates().catch(e=>document.getElementById('status').textContent='데이터를 확인할 수 없습니다: '+e.message);
</script></body></html>
